version: '3'
services:
  postgresql:
    image: postgres:16
    networks:
      - api_network
    volumes:
      - ./db/postgres-data:/var/lib/postgresql/data
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=api_server
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  api-server:
    image: api-server:0.0.1-SNAPSHOT
    networks:
      - api_network
    ports:
      - "8080:8080"
    depends_on:
      - postgresql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/api_server
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
networks:
  api_network:
    driver: bridge
