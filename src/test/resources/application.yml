spring:
  profiles:
    include: oauth
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      connect-timeout: 1000
      command-timeout: 5000
      batch-size: 1000
  datasource:
    url: jdbc:tc:postgresql:16:///test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        format_sql: true
        default_batch_fetch_size: 100
        show_sql: true
  jwt:
    secret: testToken
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

#    org:
#      hibernate:
#        SQL: debug
server:
  port: 8080
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB
  error:
    whitelabel:
      enabled: false
decorator:
  datasource:
    p6spy:
      enable-logging: true
logging:
  level:
    root: info
app:
  auth:
    signup-pending-ttl: 30m
    email-send-queue-name: email_send_requests
    token-version-cache-ttl: 12h
    access-token-ttl: 10m
    refresh-token-ttl: 14d
    email-worker-enabled: false
    email-worker-batch-size: 10
    email-worker-visibility-timeout: 5m
    email-worker-fixed-delay-millis: 15000
    email-delivery-mode: log
    email-from-address: no-reply@test.local
    signup-verify-base-url: https://example.test/auth/signup/verify
